name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify lock, lint, format, coverage and C# fixture E2E
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "lock check failed: $LASTEXITCODE" }
          uv sync --locked --extra dev
          if ($LASTEXITCODE -ne 0) { throw "dependency sync failed: $LASTEXITCODE" }
          uv run --locked --extra dev ruff check src tests scripts
          if ($LASTEXITCODE -ne 0) { throw "lint failed: $LASTEXITCODE" }
          uv run --locked --extra dev ruff format --check src tests scripts
          if ($LASTEXITCODE -ne 0) { throw "format check failed: $LASTEXITCODE" }
          uv run --locked --extra dev pytest --cov=sts2_tas --cov-fail-under=100
          if ($LASTEXITCODE -ne 0) { throw "tests/coverage/fixture E2E failed: $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "diff check failed: $LASTEXITCODE" }

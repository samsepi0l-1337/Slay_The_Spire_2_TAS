name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify lock, lint, format, coverage and C# fixture E2E
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "lock check failed: $LASTEXITCODE" }
          uv sync --locked --extra dev
          if ($LASTEXITCODE -ne 0) { throw "dependency sync failed: $LASTEXITCODE" }
          uv run --locked --extra dev ruff check src tests scripts bridge/tests
          if ($LASTEXITCODE -ne 0) { throw "lint failed: $LASTEXITCODE" }
          uv run --locked --extra dev ruff format --check src tests scripts bridge/tests
          if ($LASTEXITCODE -ne 0) { throw "format check failed: $LASTEXITCODE" }
          uv run --locked --extra dev pytest --cov=sts2_tas --cov-fail-under=100
          if ($LASTEXITCODE -ne 0) { throw "tests/coverage/fixture E2E failed: $LASTEXITCODE" }
          dotnet run --project bridge/tests/EventChoices/EventChoices.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "event eligibility checks failed: $LASTEXITCODE" }
          dotnet format whitespace bridge/Sts2TelemetryBridge/Sts2TelemetryBridge.csproj --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw "fixture C# whitespace failed: $LASTEXITCODE" }
          dotnet format whitespace bridge/tests/EventChoices/EventChoices.csproj --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw "event eligibility C# whitespace failed: $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "diff check failed: $LASTEXITCODE" }

name: Build Windows Executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-exe.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "data/fixtures/**"
      - "tests/**"
      - "config/**"
      - "bridge/Sts2TelemetryBridge/**"
      - "src/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build executable
        shell: pwsh
        run: ./scripts/build-windows-exe.ps1

      - name: Smoke executable
        shell: pwsh
        run: |
          ./dist/sts2-tas.exe --help
          if ($LASTEXITCODE -ne 0) { throw "executable help failed: $LASTEXITCODE" }

      - name: Smoke PyTorch train in frozen exe
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP "ml-smoke.pt"
          ./dist/sts2-tas.exe train-bc `
            --dataset data/fixtures/ml-train-smoke.jsonl `
            --model $model
          if ($LASTEXITCODE -ne 0) { throw "train-bc failed: $LASTEXITCODE" }
          if (-not (Test-Path $model)) { throw "train-bc did not write model: $model" }

      - name: Smoke fixture bridge contract in frozen exe
        shell: pwsh
        run: |
          ./dist/sts2-tas.exe bridge-smoke --fixture data/fixtures/telemetry-combat.json
          if ($LASTEXITCODE -ne 0) { throw "bridge-smoke failed: $LASTEXITCODE" }

      - name: Smoke dry-run action planner in frozen exe
        shell: pwsh
        run: |
          ./dist/sts2-tas.exe act --action-json '{"action_type":"end_turn","args":{}}'
          if ($LASTEXITCODE -ne 0) { throw "action planner failed: $LASTEXITCODE" }

      - name: Smoke Q-star play loop in frozen exe
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP "qstar.json"
          $output = Join-Path $env:RUNNER_TEMP "qstar.jsonl"
          ./dist/sts2-tas.exe run-qstar `
            --snapshot data/fixtures/telemetry-combat.json `
            --model $model `
            --output $output `
            --episodes 1 `
            --search-depth 1
          if ($LASTEXITCODE -ne 0) { throw "run-qstar failed: $LASTEXITCODE" }
          if (-not (Test-Path $model)) { throw "run-qstar did not write model: $model" }

      - name: Upload executable
        uses: actions/upload-artifact@v5
        with:
          name: sts2-tas-windows-x64
          path: dist/sts2-tas.exe
          if-no-files-found: error
